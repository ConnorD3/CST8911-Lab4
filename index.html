<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Simple Webpage</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Simple HTML page</h1>
    <button id="button1" onclick="press()">Press here!</button>
    <p id="text"></p>
    <script>
      function press(){
        document.getElementById("text").textContent = "Button was pressed!";
        }
      }
    </script>
  </body>
</html>
